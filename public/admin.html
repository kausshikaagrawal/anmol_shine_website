<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Admin Dashboard - Anmol Shine</title>
<link rel="icon" type="image/jpeg" href="/images/logo.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f8f9ff] text-[#0b1c30] min-h-screen">

<!-- Login gate: shown until a valid admin key is entered -->
<div id="login-gate" class="min-h-screen flex items-center justify-center px-4">
  <form id="login-form" class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8 w-full max-w-sm flex flex-col gap-4">
    <h1 class="text-xl font-bold text-[#001e40]">Admin sign-in</h1>
    <p class="text-sm text-slate-500 -mt-2">Enter the admin key from your server's .env file.</p>
    <input id="admin-key-input" type="password" placeholder="Admin key" required
           class="w-full rounded border border-slate-300 px-3 py-2 focus:border-[#D4AF37] focus:ring-1 focus:ring-[#D4AF37] outline-none">
    <div id="login-error" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded p-2"></div>
    <button type="submit" class="bg-[#D4AF37] text-white px-4 py-2 rounded font-semibold hover:brightness-90 transition-colors">
      Sign in
    </button>
  </form>
</div>

<!-- Dashboard: hidden until sign-in succeeds -->
<div id="dashboard" class="hidden max-w-[1100px] mx-auto px-4 md:px-8 py-10">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-2xl font-bold text-[#001e40]">Anmol Shine — Admin Dashboard</h1>
    <button id="logout-btn" class="text-sm text-slate-500 hover:text-[#D4AF37] underline">Sign out</button>
  </div>

  <!-- Stat cards -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
    <div class="bg-white border border-slate-200 rounded-2xl p-5">
      <p class="text-sm text-slate-500">Total inquiries</p>
      <p id="stat-total" class="text-3xl font-bold text-[#001e40] mt-1">—</p>
    </div>
    <div class="bg-white border border-slate-200 rounded-2xl p-5">
      <p class="text-sm text-slate-500">New / unread</p>
      <p id="stat-new" class="text-3xl font-bold text-[#D4AF37] mt-1">—</p>
    </div>
    <div class="bg-white border border-slate-200 rounded-2xl p-5">
      <p class="text-sm text-slate-500">Quote requests</p>
      <p id="stat-quotes" class="text-3xl font-bold text-[#001e40] mt-1">—</p>
    </div>
  </div>

  <!-- Top products -->
  <div class="bg-white border border-slate-200 rounded-2xl p-5 mb-8">
    <p class="text-sm font-semibold text-slate-600 mb-3">Most-requested products</p>
    <div id="top-products" class="flex flex-wrap gap-2 text-sm">—</div>
  </div>

  <!-- Filters -->
  <div class="flex gap-3 mb-4">
    <select id="filter-status" class="rounded border border-slate-300 px-3 py-2 text-sm bg-white">
      <option value="">All statuses</option>
      <option value="new">New</option>
      <option value="contacted">Contacted</option>
      <option value="closed">Closed</option>
    </select>
    <select id="filter-type" class="rounded border border-slate-300 px-3 py-2 text-sm bg-white">
      <option value="">All types</option>
      <option value="quote">Quote requests</option>
      <option value="contact">General inquiries</option>
    </select>
    <button id="refresh-btn" class="rounded border border-slate-300 px-3 py-2 text-sm bg-white hover:bg-slate-50">Refresh</button>
  </div>

  <!-- Inquiries table -->
  <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-left text-slate-500">
        <tr>
          <th class="p-3">Date</th>
          <th class="p-3">Type</th>
          <th class="p-3">Name</th>
          <th class="p-3">Contact</th>
          <th class="p-3">Product</th>
          <th class="p-3">Message</th>
          <th class="p-3">Status</th>
        </tr>
      </thead>
      <tbody id="inquiries-body">
        <tr><td colspan="7" class="p-6 text-center text-slate-400">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="/js/admin.js"></script>
</body></html>
